
name: Enterprise Application Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif \
            application/backend/

      - name: Upload SARIF results
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save Semgrep report
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  sca:
    name: SCA - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: application/backend/
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-sca.sarif
          exit-code: '0'
      - name: Upload SCA results to GitHub Code Scanning
        if: always() && hashFiles('trivy-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca

      - name: Save Trivy SCA report
        if: always() && hashFiles('trivy-sca.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca.sarif
          if-no-files-found: ignore
  iac:
    name: IaC Security - Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

      - name: Upload Checkov results
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov-iac
      - name: Save Checkov report
        if: always() && hashFiles('checkov.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov.sarif
          if-no-files-found: ignore

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-production"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Django dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt

      - name: Apply database migrations
        working-directory: application/backend
        run: python manage.py migrate --noinput

      - name: Start Django application
        working-directory: application/backend
        run: |
          python manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/admin/login/; then
              echo "Django application is ready"
              exit 0
            fi
            sleep 2
          done
          cat django.log
          exit 1

      - name: Run OWASP ZAP baseline scan
        continue-on-error: true
        run: |
          mkdir -p zap-work
          chmod 777 zap-work

          docker run --network host \
            -v "$PWD/zap-work:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000/admin/login/ \
            -J zap-report.json \
            -r zap-report.html

      - name: Upload ZAP reports
        if: always() && hashFiles('zap-work/zap-report.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-reports
          path: zap-work/zap-report.*
          if-no-files-found: ignore


  secrets:
    name: Secrets Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  container-security:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t miniature-enterprise-appsec:${{ github.sha }} \
            ./application/backend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: miniature-enterprise-appsec:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln,secret
          exit-code: '0'

      - name: Upload container scan results
        if: always() && hashFiles('trivy-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container
      - name: Save Trivy container report
        if: always() && hashFiles('trivy-container.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-container.sarif
          if-no-files-found: ignore

  reporting:
    name: Consolidated AppSec Dashboard
    runs-on: ubuntu-latest

    needs:
      - sast
      - sca
      - iac
      - dast
      - secrets
      - container-security

    # Run reporting even if one or more scanner jobs fail.
    if: always()

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Download Semgrep results
      - name: Download Semgrep report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: security-reporting/scan-reports/semgrep-report

      # Download Trivy SCA results
      - name: Download Trivy SCA report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trivy-sca-report
          path: security-reporting/scan-reports/trivy-sca-report

      # Download Checkov results
      - name: Download Checkov report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: checkov-report
          path: security-reporting/scan-reports/checkov-report

      # Download OWASP ZAP results
      - name: Download OWASP ZAP report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: owasp-zap-reports
          path: security-reporting/scan-reports/owasp-zap-reports

      # Download Gitleaks results
      - name: Download Gitleaks report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: security-reporting/scan-reports/gitleaks-results.sarif
      - name: Create empty Gitleaks report when scan succeeds without findings
        if: always() && needs.secrets.result == 'success' && hashFiles('security-reporting/scan-reports/gitleaks-results.sarif/**/*.sarif', 'security-reporting/scan-reports/gitleaks-results.sarif/*.sarif') == ''
        run: |
          mkdir -p security-reporting/scan-reports/gitleaks-results.sarif

          cat > security-reporting/scan-reports/gitleaks-results.sarif/results.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Gitleaks",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF

      # Download Trivy container results
      - name: Download Trivy container report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trivy-container-report
          path: security-reporting/scan-reports/trivy-container-report

      # Install reporting dependencies
      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r security-reporting/requirements.txt

      # Consolidate all scanner findings
      - name: Generate consolidated findings
        run: |
          python security-reporting/generate_report.py \
            --input security-reporting/scan-reports \
            --output security-reporting/parsed-findings.json
          # Upload consolidated findings for quality-gate evaluation
      - name: Upload consolidated findings
        if: always() && hashFiles('security-reporting/parsed-findings.json') != ''
        uses: actions/upload-artifact@v4
        with:
         name: consolidated-security-findings
         path: security-reporting/parsed-findings.json
         if-no-files-found: error
         retention-days: 14

      # Generate HTML dashboard
      - name: Generate HTML dashboard
        run: |
          python security-reporting/generate_dashboard.py \
            --input security-reporting/parsed-findings.json \
            --output security-reporting/enterprise-security-report.html

      # Upload the generated dashboard
      - name: Upload consolidated security dashboard
        id: upload-dashboard
        if: always() && hashFiles('security-reporting/enterprise-security-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-security-dashboard
          path: security-reporting/enterprise-security-report.html
          if-no-files-found: error
          retention-days: 14

      # Add dashboard link to workflow summary
      - name: Add dashboard link to workflow summary
        if: steps.upload-dashboard.outcome == 'success'
        run: |
          echo "## Consolidated Application Security Dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Enterprise Security Dashboard](${{ steps.upload-dashboard.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    needs: reporting
    if: always()

    steps:
      - name: Fail if reporting did not complete
        if: needs.reporting.result != 'success'
        run: |
          echo "::error::Reporting job failed. Quality gate cannot evaluate findings."
          exit 1

      - name: Checkout repository
        if: needs.reporting.result == 'success'
        uses: actions/checkout@v4

      - name: Download consolidated findings
        if: needs.reporting.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: consolidated-security-findings
          path: security-reporting

      - name: Set up Python
        if: needs.reporting.result == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Evaluate security quality gate
        if: needs.reporting.result == 'success'
        run: |
          python security-reporting/quality_gate.py \
            --input security-reporting/parsed-findings.json